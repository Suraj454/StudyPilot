  - id: 1
    title: "What Are Custom Hooks?"
  - id: 2
    title: "Rules of Hooks"
  - id: 3
    title: "Creating Your First Custom Hook"
  - id: 4
    title: "Sharing Logic Between Components"
  - id: 5
    title: "Understanding the Context API"
  - id: 6
    title: "Creating a Context"
  - id: 7
    title: "Using Context with useContext"
  - id: 8
    title: "Understanding Prop Drilling"
  - id: 9
