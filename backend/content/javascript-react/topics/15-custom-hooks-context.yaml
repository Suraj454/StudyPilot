questions:
  # --- DIAGNOSTIC QUESTIONS (2 Total) ---
  - questionText: "What problem does React Context solve in component tree architectures?"
    options:
      - id: 1
        text: "It optimizes local component CSS module rendering."
      - id: 2
        text: "It avoids 'prop drilling' by allowing data to be shared directly with deep components without manually passing props through every intermediate level."
      - id: 3
        text: "It replaces PostgreSQL database queries with client-side caching."
      - id: 4
        text: "It automatically memoizes heavy calculations using web workers."
    correctOptionId: 2
    explanation: "Context provides a way to pass data down the component tree without manually passing props down level-by-level through components that do not need them."
    type: "DIAGNOSTIC"

  - questionText: "What is the mandatory naming convention required for custom React hooks?"
    options:
      - id: 1
        text: "The function name must end with `Hook` (e.g., `fetchUserHook`)."
      - id: 2
        text: "The function name must start with the prefix `use` (e.g., `useFetchUser`)."
      - id: 3
        text: "The function name must start with an uppercase letter like a component."
      - id: 4
        text: "Custom hooks must be exported as default arrow functions."
    correctOptionId: 2
    explanation: "React relies on the `use` prefix to automatically inspect and enforce the Rules of Hooks via linters and compiler static checks."
    type: "DIAGNOSTIC"

  # --- QUIZ QUESTIONS (5 Total) ---
  - questionText: |
      What will happen when two separate components invoke the exact same custom hook `useCounter()`?
      ```jsx
      function ComponentA() { const { count } = useCounter(); return <div>{count}</div>; }
      function ComponentB() { const { count } = useCounter(); return <div>{count}</div>; }
      ```
    options:
      - id: 1
        text: "They share the exact same state instance automatically."
      - id: 2
        text: "Each component invocation creates a completely isolated, independent copy of state and side effects."
      - id: 3
        text: "It throws a duplicate hook execution error."
      - id: 4
        text: "The second invocation overwrites the first component's state."
    correctOptionId: 2
    explanation: "Custom hooks share stateful **logic**, not state itself. Every call to a custom hook gets its own completely isolated state container."
    type: "QUIZ"

  - questionText: "Which of the following violates the foundational Rules of Hooks in React?"
    options:
      - id: 1
        text: "Calling `useState` inside a custom hook starting with `use`."
      - id: 2
        text: "Calling `useEffect` inside a conditional `if` statement or loop."
      - id: 3
        text: "Calling `useContext` at the top level of a function component."
      - id: 4
        text: "Extracting `useCallback` into an external helper hook file."
    correctOptionId: 2
    explanation: "Hooks must always be called at the top level of React functions, before any early returns, conditionals, or loops, to guarantee identical call order on every render."
    type: "QUIZ"

  - questionText: |
      What happens to consuming components when the value provided by a `<ThemeContext.Provider value={theme}>` updates?
      ```jsx
      const theme = 'dark';
      return (
        <ThemeContext.Provider value="{theme}">
          <ChildComponent/>
        </ThemeContext.Provider>
      );
      ```
    options:
      - id: 1
        text: "Only components that call `useContext(ThemeContext)` will re-render when `theme` changes."
      - id: 2
        text: "Every child component in the entire React tree re-renders, regardless of whether it consumes the context."
      - id: 3
        text: "The browser executes a full page reload."
      - id: 4
        text: "Context values cannot be updated dynamically once initialized."
    correctOptionId: 1
    explanation: |
      React automatically re-renders all subscribers (components invoking `useContext` for that specific context) whenever the provider's `value` prop changes.
    type: "QUIZ"

  - questionText: "When should you prefer using a Custom Hook over React Context?"
    options:
      - id: 1
        text: "When you need to broadcast global user authentication state across the entire app."
      - id: 2
        text: "When you want to encapsulate and reuse stateful logic or side effects (like data fetching or window resizing) across independent components."
      - id: 3
        text: "When you want to replace Redux with a global state store."
      - id: 4
        text: "When you need to pass props down through 10 layers of components."
    correctOptionId: 2
    explanation: "Custom hooks are designed for logic reuse, whereas Context is designed for sharing data deeply down the component tree without prop drilling."
    type: "QUIZ"

  - questionText: |
      Consider the following custom hook. Why might `useLocalStorage` cause bugs if not written carefully?
      ```jsx
      function useLocalStorage(key, initialValue) {
        const [value, setValue] = useState(() => {
          return localStorage.getItem(key) ?? initialValue;
        });
        useEffect(() => {
          localStorage.setItem(key, value);
        }, [key, value]);
        return [value, setValue];
      }
      ```
    options:
      - id: 1
        text: "Custom hooks cannot use `useState` inside them."
      - id: 2
        text: "Synchronizing synchronous browser APIs like `localStorage` directly inside `useEffect` on every render cycle can lead to performance overhead or infinite sync loops if unoptimized."
      - id: 3
        text: "Local storage values are automatically deleted by React on component unmount."
      - id: 4
        text: "Effect hooks cannot accept dependencies like `key` or `value`."
    correctOptionId: 2
    explanation: "While functional, handling external storage sync requires careful dependency management to prevent unnecessary writes or cross-tab desynchronization."
    type: "QUIZ"