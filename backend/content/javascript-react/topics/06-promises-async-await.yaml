id: 6
title: "Promises and async/await"
description: "Understand how JavaScript handles asynchronous operations using promises and async/await, including chaining, error handling, and running multiple operations concurrently."

prerequisites:
  - 5

subtopics:
  - id: 1
    title: "Understanding Asynchronous Operations"
  - id: 2
    title: "What Is a Promise?"
  - id: 3
    title: "Promise States"
  - id: 4
    title: "Creating and Consuming Promises"
  - id: 5
    title: "Promise Chaining"
  - id: 6
    title: "Error Handling with catch and finally"
  - id: 7
    title: "Understanding async and await"
  - id: 8
    title: "Error Handling with try and catch"
  - id: 9
    title: "Promise.all, Promise.allSettled, Promise.race and Promise.any"
  - id: 10
    title: "Sequential vs Parallel Execution"
  - id: 11
    title: "Practical API Request Examples"

questions:
  # --- DIAGNOSTIC QUESTIONS (2 Total) ---
  - questionText: "What are the three possible states of a JavaScript Promise?"
    options:
      - id: 1
        text: "Started, Paused, Stopped"
      - id: 2
        text: "Pending, Fulfilled, Rejected"
      - id: 3
        text: "Loading, Success, Failure"
      - id: 4
        text: "Active, Waiting, Completed"
    correctOptionId: 2
    explanation: "A Promise is always in one of three states: pending (initial state), fulfilled (operation completed successfully), or rejected (operation failed)."
    type: "DIAGNOSTIC"

  - questionText: "How does the `async/await` syntax relate to Promises in JavaScript?"
    options:
      - id: 1
        text: "It replaces Promises entirely with multithreaded background workers."
      - id: 2
        text: "It is syntactic sugar built on top of Promises, making asynchronous code read synchronously."
      - id: 3
        text: "It can only be used with synchronous file system calls."
      - id: 4
        text: "It automatically prevents all runtime errors without try/catch blocks."
    correctOptionId: 2
    explanation: "`async/await` is a cleaner, more readable way to work with promises, where `async` functions always return a promise and `await` pauses execution until the promise settles."
    type: "DIAGNOSTIC"

  # --- QUIZ QUESTIONS (5 Total) ---
  - questionText: |
      What will be the output of the following code snippet?
      ```javascript
      Promise.resolve(1)
        .then((x) => x + 1)
        .then((x) => { throw new Error('Oops'); })
        .catch(() => 3)
        .then((x) => x + 1)
        .then((x) => console.log(x));
      ```
    options:
      - id: 1
        text: "2"
      - id: 2
        text: "3"
      - id: 3
        text: "4"
      - id: 4
        text: "Error: Oops"
    correctOptionId: 3
    explanation: "1. Starts at 1. 2. `.then` adds 1 to become 2. 3. `.then` throws an error. 4. `.catch` catches it and returns 3. 5. Next `.then` receives 3 and adds 1 to log 4."
    type: "QUIZ"

  - questionText: "Which static Promise method rejects immediately as soon as *any* of the input promises rejects, without waiting for the others?"
    options:
      - id: 1
        text: "Promise.all()"
      - id: 2
        text: "Promise.allSettled()"
      - id: 3
        text: "Promise.race()"
      - id: 4
        text: "Promise.any()"
    correctOptionId: 1
    explanation: "`Promise.all()` fails fast: if any single promise rejects, the entire returned promise rejects immediately."
    type: "QUIZ"

  - questionText: |
      Consider the async function below. What does it return when called?
      ```javascript
      async function getData() {
        return 'Hello StudyPilot';
      }
      ```
    options:
      - id: 1
        text: "A string: 'Hello StudyPilot'"
      - id: 2
        text: "A Promise resolved with the string 'Hello StudyPilot'"
      - id: 3
        text: "undefined"
      - id: 4
        text: "An error"
    correctOptionId: 2
    explanation: "An `async` function always wraps its return value in a resolved Promise (unless it explicitly throws or returns another promise)."
    type: "QUIZ"

  - questionText: "When should you use `Promise.allSettled()` instead of `Promise.all()`?"
    options:
      - id: 1
        text: "When you want to execute requests sequentially instead of concurrently."
      - id: 2
        text: "When you want the result regardless of whether some promises fail or reject."
      - id: 3
        text: "When you only care about the fastest responding promise."
      - id: 4
        text: "When you want to save memory on large arrays."
    correctOptionId: 2
    explanation: "`Promise.allSettled()` waits for all input promises to complete (whether fulfilled or rejected), returning an array of objects describing the outcome of each."
    type: "QUIZ"

  - questionText: |
      What will be the output sequence of logging in this snippet?
      ```javascript
      async function test() {
        console.log('A');
        await Promise.resolve();
        console.log('B');
      }
      test();
      console.log('C');
      ```
    options:
      - id: 1
        text: "A, B, C"
      - id: 2
        text: "A, C, B"
      - id: 3
        text: "C, A, B"
      - id: 4
        text: "A, B, C (all synchronous)"
    correctOptionId: 2
    explanation: "1. 'A' logs synchronously. 2. `await` pauses the function and schedules the rest as a microtask, returning control to the caller. 3. 'C' logs synchronously. 4. The microtask queue runs, logging 'B'."
    type: "QUIZ"