  - id: 1
    title: "Props vs State"
  - id: 2
    title: "Understanding the useState Hook"
  - id: 3
    title: "Declaring and Updating State"
  - id: 4
    title: "State Updates and Re-rendering"
  - id: 5
    title: "Why State Updates May Be Asynchronous"
  - id: 6
    title: "Functional State Updates"
  - id: 7
    title: "Updating Objects in State"
  - id: 8
